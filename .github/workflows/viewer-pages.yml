name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "src/lib/calc.js"
      - "src/lib/db.js"
      - "src/lib/undo.js"
      - "src/components/**"
      - "src/styles.js"
      - ".github/workflows/viewer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
      # Needed too: src/components/*.jsx (reused by the viewer unmodified)
      # import lucide-react etc. with plain relative paths, so Node's module
      # resolution walks up from src/ looking for node_modules — it only
      # finds them here, at the repo root, not in viewer/node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
